    <rect x="410" y="95" width="230" height="300" rx="12" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
    <rect x="670" y="120" width="230" height="300" rx="12" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
