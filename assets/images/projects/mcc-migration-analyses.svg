  </defs>
  <rect width="1200" height="525" fill="url(#bg)"/>
  <!-- globe meridians -->
  <g fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2">
    <circle cx="980" cy="262" r="230"/><ellipse cx="980" cy="262" rx="110" ry="230"/><ellipse cx="980" cy="262" rx="230" ry="90"/><path d="M750 262h460M980 32v460"/>
