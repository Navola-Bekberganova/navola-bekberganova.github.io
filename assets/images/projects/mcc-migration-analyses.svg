    <g fill="#c9a45c"><rect x="450" y="300" width="26" height="55"/><rect x="490" y="275" width="26" height="80"/><rect x="530" y="250" width="26" height="105"/><rect x="570" y="285" width="26" height="70"/></g>
    <circle cx="785" cy="330" r="48" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="18"/>
    <path d="M785 282a48 48 0 0 1 46 60" fill="none" stroke="#c9a45c" stroke-width="18"/>
