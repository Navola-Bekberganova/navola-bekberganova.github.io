  <g font-family="Inter, Arial, sans-serif" font-size="17" fill="#fff" fill-opacity=".75" letter-spacing="2" text-anchor="middle">
    <text x="265" y="455">CENTRAL ASIA</text><text x="525" y="430">UNITED KINGDOM</text><text x="785" y="455">ECONOMY</text>
