<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <script>
    /* GitHub Pages serves this file for ANY missing URL, at any depth, so
       relative paths must be anchored to the site root with <base>.
       - Project site (username.github.io/REPO/): root is detected automatically.
       - User site (username.github.io) or a custom domain: set SITE_ROOT = "/". */
    var SITE_ROOT = "/"; // site is served at https://navola-bekberganova.github.io/
    (function () {
      var root = SITE_ROOT;
      if (!root) {
        var seg = location.pathname.split("/").filter(Boolean)[0];
        root = /\.github\.io$/.test(location.hostname) && seg && !/\.html?$/.test(seg) ? "/" + seg + "/" : "/";
      }
      if (location.protocol !== "file:") document.write('<base href="' + root + '">');
    })();
  </script>
  <title>Page not found — Navola Bekberganova</title>
  <meta name="description" content="The page you are looking for could not be found.">
  <meta name="theme-color" content="#102542">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body data-page="404">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <section class="section">
      <div class="container">
        <div class="empty-state">
          <p class="eyebrow">Error 404</p>
          <h1 class="section-title">Page not found</h1>
          <p>The page you are looking for may have moved or no longer exists.</p>
          <div class="btn-row" style="justify-content:center;margin-top:24px">
            <a class="btn btn--primary" href="index.html">Back to home</a>
            <a class="btn btn--secondary" href="contact.html">Contact</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
